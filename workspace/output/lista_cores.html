<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Lista de Cores</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    h1 { margin-bottom: 24px; }
    .item { display: flex; align-items: center; margin: 12px 0; font-size: 18px; }
    .swatch { width: 44px; height: 24px; border: 1px solid #333; margin-right: 14px; }
  </style>
</head>
<body>
  <h1>Lista de Cores</h1>
  <div class="item"><div class="swatch" style="background:#ff0000"></div>Vermelho</div>
  <div class="item"><div class="swatch" style="background:#0000ff"></div>Azul</div>
  <div class="item"><div class="swatch" style="background:#008000"></div>Verde</div>
  <div class="item"><div class="swatch" style="background:#ffff00"></div>Amarelo</div>
  <div class="item"><div class="swatch" style="background:#ffa500"></div>Laranja</div>
  <div class="item"><div class="swatch" style="background:#800080"></div>Roxo</div>
  <div class="item"><div class="swatch" style="background:#ffc0cb"></div>Rosa</div>
  <div class="item"><div class="swatch" style="background:#8b4513"></div>Marrom</div>
  <div class="item"><div class="swatch" style="background:#808080"></div>Cinza</div>
  <div class="item"><div class="swatch" style="background:#000000"></div><span style="margin-left:14px">Preto</span></div>
  <div class="item"><div class="swatch" style="background:#ffffff"></div>Branco</div>
</body>
</html>
