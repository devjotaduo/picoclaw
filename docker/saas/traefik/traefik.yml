global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

accessLog: {}

api:
  dashboard: false
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        # Sofia/Catarina podem manter requests longos durante turns com LLM
        # e tool calls. 0 = sem limite aqui; os caps downstream ficam nos
        # servidores Go, que encerram conexoes presas.
        readTimeout: "0s"
        idleTimeout: "0s"

providers:
  docker:
    # Mount /var/run/docker.sock directly. The dockerproxy v0.3 strips the
    # Docker API version negotiation headers, which makes Traefik fall back to
    # API 1.24 — rejected by Docker daemon >= 29.x (MinAPIVersion 1.40).
    # The proxy is still in front of the controlplane for tenant create/start.
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: saas_edge
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      # Hardcoded for the Jotaduo deployment — Traefik does NOT interpolate
      # env vars inside the static YAML (so `${LE_EMAIL}` would be sent
      # literally to Let's Encrypt and rejected as "unable to parse email").
      # If you fork this stack, swap this to your own contact address.
      email: "dev@jotaduo.com"
      storage: "/letsencrypt/acme.json"
      # HTTP-01 challenge: works without a Cloudflare DNS API token. Each
      # tenant subdomain gets its own cert lazily — the tenant-router
      # systemd watcher (docker/saas/scripts/tenant-router/) writes a
      # concrete Host() router per running tenant so Traefik knows what to
      # request a cert for. Wildcard via DNS-01 would need CF_DNS_API_TOKEN.
      httpChallenge:
        entryPoint: web
