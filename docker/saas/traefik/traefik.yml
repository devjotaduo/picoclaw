global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

accessLog: {}

api:
  dashboard: false
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    # Mount /var/run/docker.sock directly. The dockerproxy v0.3 strips the
    # Docker API version negotiation headers, which makes Traefik fall back to
    # API 1.24 — rejected by Docker daemon >= 29.x (MinAPIVersion 1.40).
    # The proxy is still in front of the controlplane for tenant create/start.
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: saas_edge
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

# certificatesResolvers are defined via docker-compose `command:` flags so the
# `${LE_EMAIL}` placeholder gets interpolated by docker-compose (Traefik does
# not interpolate env vars inside the static YAML).
