name: picoclaw-saas

networks:
  saas_edge:
    name: saas_edge
    driver: bridge
  saas_llm:
    name: saas_llm
    driver: bridge
    internal: false
  saas_db:
    name: saas_db
    driver: bridge
    internal: true
  saas_dockerproxy:
    name: saas_dockerproxy
    driver: bridge
    internal: true

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/saas/postgres/data
  traefik_letsencrypt:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/saas/traefik
  controlplane_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/saas/controlplane/data

services:

  # Filtering proxy in front of /var/run/docker.sock. Replaces the bind-mount
  # of the raw socket into Traefik and controlplane, blocking dangerous
  # endpoints (EXEC, VOLUMES, BUILD, SWARM) while allowing what we need:
  #   - CONTAINERS=1 + POST=1 → create/start/stop/remove tenant containers
  #   - NETWORKS=1          → connect tenant containers to saas_edge/saas_llm
  #   - IMAGES=1            → pull tenant image
  #   - INFO=1              → daemon version negotiation
  #   - EVENTS=1            → Traefik live-discovery of new containers
  # A compromised controlplane can no longer EXEC into other containers or
  # read raw Docker volumes.
  dockerproxy:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: dockerproxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      IMAGES: "1"
      INFO: "1"
      EVENTS: "1"
      POST: "1"
      VOLUMES: "0"
      EXEC: "0"
      BUILD: "0"
      SWARM: "0"
      SYSTEM: "0"
      DISTRIBUTION: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - saas_dockerproxy

  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - dockerproxy
    command:
      - "--configFile=/etc/traefik/traefik.yml"
      # ACME resolver via CLI flags so docker-compose interpolates ${LE_EMAIL}
      # (Traefik does not interpolate env vars inside the static YAML).
      - "--certificatesresolvers.letsencrypt.acme.email=${LE_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    environment:
      LE_EMAIL: ${LE_EMAIL}
    volumes:
      # Direct socket bind — dockerproxy v0.3 strips API version negotiation
      # headers, which makes Traefik fall back to API 1.24 (rejected by Docker
      # daemon >= 29.x). See docs/operations/saas-vps-deploy.md.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - saas_edge
      - saas_dockerproxy
    labels:
      - "traefik.enable=false"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_CONTROL}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    networks:
      - saas_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_CONTROL}"]
      interval: 10s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_LITELLM}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command:
      - "--config=/app/config.yaml"
      - "--port=4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      - saas_llm
      - saas_db

  opencrm:
    image: picoclaw/opencrm:latest
    build:
      context: ../..
      dockerfile: docker/saas/opencrm/Dockerfile
    container_name: opencrm
    restart: unless-stopped
    environment:
      OPENCRM_DB_PATH: /data/opencrm.db
      OPENCRM_PORT: "8787"
    ports:
      - "127.0.0.1:18802:8787"
    volumes:
      - /srv/saas/opencrm/data:/data
    networks:
      - saas_db
      - saas_edge
    labels:
      - "traefik.enable=false"

  controlplane:
    image: picoclaw/saas:latest
    build:
      context: ../..
      dockerfile: docker/saas/Dockerfile
    container_name: controlplane
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      dockerproxy:
        condition: service_started
      opencrm:
        condition: service_started
    ports:
      - "127.0.0.1:18801:8080"
    environment:
      PG_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_CONTROL}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      PICOCLAW_SAAS_GATEWAY_SECRET: ${PICOCLAW_SAAS_GATEWAY_SECRET:-}
      JWT_TTL_HOURS: "12"
      LISTEN_ADDR: ":8080"
      DOCKER_HOST: "tcp://dockerproxy:2375"
      LITELLM_URL: ${LITELLM_URL}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      TENANT_IMAGE: ${TENANT_IMAGE}
      TENANT_BASE_DOMAIN: ${SAAS_BASE_DOMAIN}
      TENANT_HOST_DATA_DIR: ${TENANT_HOST_DATA_DIR}
      TENANT_PROFILE_DIR: ${TENANT_PROFILE_DIR:-/var/lib/picoclaw-saas/launcher-profiles}
      TENANT_NETWORK_EDGE: saas_edge
      TENANT_NETWORK_LLM: saas_llm
      COOKIE_DOMAIN: ${SAAS_BASE_DOMAIN}
      COOKIE_SECURE: "true"
      OPENCRM_URL: ${OPENCRM_URL:-http://opencrm:8787}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_FROM: ${ALERT_FROM:-}
      ALERT_TO: ${ALERT_TO:-}
      ALERT_DISK_THRESHOLD_PCT: ${ALERT_DISK_THRESHOLD_PCT:-85}
      # Auto-provision: when true, Clara's mark_qualified hands off directly
      # to the provisioner so qualified visitors get a working dashboard URL
      # before the SSE stream closes. Keep false until Supabase is wired and
      # the per-IP rate-limit is tuned for production traffic.
      PICOCLAW_SAAS_AUTO_PROVISION: ${PICOCLAW_SAAS_AUTO_PROVISION:-false}
      PICOCLAW_SAAS_AUTO_PROVISION_PROFILE: ${PICOCLAW_SAAS_AUTO_PROVISION_PROFILE:-default-business}
      PICOCLAW_SAAS_AUTO_PROVISION_PER_IP_DAY: ${PICOCLAW_SAAS_AUTO_PROVISION_PER_IP_DAY:-3}
      PICOCLAW_SAAS_AUTO_PROVISION_LOGIN_MODE: ${PICOCLAW_SAAS_AUTO_PROVISION_LOGIN_MODE:-magic_link}
      PICOCLAW_SAAS_AUTO_PROVISION_WORKSPACE_DIR: ${PICOCLAW_SAAS_AUTO_PROVISION_WORKSPACE_DIR:-}
      # Supabase: source of truth for tenant dashboard logins when set. Leave
      # blank to keep the legacy local sessions auth path (no behavior change
      # to existing tenants — auth_backend='local' rows ignore these vars).
      SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_SITE_URL: ${SUPABASE_SITE_URL:-https://${SAAS_BASE_DOMAIN}}
    volumes:
      - /srv/saas/tenants:/srv/saas/tenants
      - controlplane_data:/var/lib/picoclaw-saas
      # Read-only bind for the canonical operator workspace that auto-provision
      # copies into each new tenant volume. Same path inside/outside the
      # container so PICOCLAW_SAAS_AUTO_PROVISION_WORKSPACE_DIR is portable.
      # OverlayWorkspace skips operator runtime state (whatsapp/, sessions/,
      # state/, *.log, *.db) and treats memory/* as non-clobbering so new
      # tenants get the empty template files and existing tenants keep what
      # they've accumulated.
      - /srv/picoclaw/workspace:/srv/picoclaw/workspace:ro
    networks:
      - saas_edge
      - saas_llm
      - saas_db
      - saas_dockerproxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=saas_edge"
      - "traefik.http.routers.controlplane.rule=Host(`${SAAS_BASE_DOMAIN}`) || Host(`admin.${SAAS_BASE_DOMAIN}`) || HostRegexp(`[a-z0-9-]+\\.${SAAS_BASE_DOMAIN}`)"
      - "traefik.http.routers.controlplane.entrypoints=websecure"
      - "traefik.http.routers.controlplane.tls.certresolver=letsencrypt"
      - "traefik.http.routers.controlplane.middlewares=security-headers@file"
      - "traefik.http.services.controlplane.loadbalancer.server.port=8080"
