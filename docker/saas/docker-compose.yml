name: picoclaw-saas

networks:
  saas_edge:
    name: saas_edge
    driver: bridge
  saas_llm:
    name: saas_llm
    driver: bridge
    internal: false
  saas_db:
    name: saas_db
    driver: bridge
    internal: true
  saas_dockerproxy:
    name: saas_dockerproxy
    driver: bridge
    internal: true

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/saas/postgres/data
  traefik_letsencrypt:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/saas/traefik
  controlplane_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/saas/controlplane/data

services:

  # Filtering proxy in front of /var/run/docker.sock. Replaces the bind-mount
  # of the raw socket into Traefik and controlplane, blocking dangerous
  # endpoints (EXEC, VOLUMES, BUILD, SWARM) while allowing what we need:
  #   - CONTAINERS=1 + POST=1 → create/start/stop/remove tenant containers
  #   - NETWORKS=1          → connect tenant containers to saas_edge/saas_llm
  #   - IMAGES=1            → pull tenant image
  #   - INFO=1              → daemon version negotiation
  #   - EVENTS=1            → Traefik live-discovery of new containers
  # A compromised controlplane can no longer EXEC into other containers or
  # read raw Docker volumes.
  dockerproxy:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: dockerproxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      IMAGES: "1"
      INFO: "1"
      EVENTS: "1"
      POST: "1"
      VOLUMES: "0"
      EXEC: "0"
      BUILD: "0"
      SWARM: "0"
      SYSTEM: "0"
      DISTRIBUTION: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - saas_dockerproxy

  traefik:
    image: traefik:v3.5
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - dockerproxy
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    environment:
      LE_EMAIL: ${LE_EMAIL}
    volumes:
      # Direct socket bind — dockerproxy v0.3 strips API version negotiation
      # headers, which makes Traefik fall back to API 1.24 (rejected by Docker
      # daemon >= 29.x). See docs/operations/saas-vps-deploy.md.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - saas_edge
      - saas_dockerproxy
    labels:
      - "traefik.enable=false"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_CONTROL}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    networks:
      - saas_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_CONTROL}"]
      interval: 10s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_LITELLM}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command:
      - "--config=/app/config.yaml"
      - "--port=4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      - saas_llm
      - saas_db

  # Headless Chromium with CDP exposed on saas_llm:9222. Every tenant
  # launcher container ships the `agent-browser` Node CLI and connects
  # here via $BROWSER_CDP_URL — no per-tenant Chromium. See
  # docker/Dockerfile.browser-sidecar for the security envelope.
  #
  # Port 9222 is bound to 127.0.0.1 (host-only) so an operator can run
  # `export BROWSER_CDP_URL=http://localhost:9222` from a shell on the
  # host for quick CDP probes / tests. NEVER expose to 0.0.0.0 — CDP is
  # fully privileged on whatever profile the headless Chromium runs.
  browser-sidecar:
    image: picoclaw/browser-sidecar:latest
    build:
      context: ../..
      dockerfile: docker/Dockerfile.browser-sidecar
    container_name: browser-sidecar
    restart: unless-stopped
    init: true
    # NOT read_only — Chromium needs to write to ~/.cache, ~/.local,
    # /tmp/.org.chromium.Chromium.* etc. Tried tmpfs over /home/chrome
    # but ownership doesn't survive a tmpfs mount on Docker so chromium
    # can't chown its profile dirs. The other security envelope still
    # applies (cap_drop=ALL, no-new-privileges, dedicated user, no
    # exposed ports beyond CDP on host-loopback).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - saas_llm
    ports:
      - "127.0.0.1:9222:9222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9222/json/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=false"

  # Owns Jotaduo's institutional WhatsApp pairing and exposes a tiny HTTP API
  # so multiple public tenants can send/receive on its behalf. Runs whatsmeow
  # (one active device per WA pairing — bind-mounting the same store.db into N
  # tenant containers would trigger duplicate-device disconnects on the real
  # number). See cmd/jotaduo-wa-sidecar and internal/jotaduowa for details.
  #
  # Operator pairs the WA once via https://adm.${SAAS_BASE_DOMAIN}/jotaduo-wa/pair
  # (admin-token gated). Public tenants get JOTADUO_WA_URL +
  # JOTADUO_WA_HMAC_SECRET via the provisioner so the
  # `enviar-whatsapp-jotaduo` skill can POST /internal/wa/send.
  jotaduo-wa:
    image: picoclaw/jotaduo-wa:latest
    build:
      context: ../..
      dockerfile: docker/saas/Dockerfile.jotaduo-wa
    container_name: jotaduo-wa
    restart: unless-stopped
    environment:
      JOTADUO_WA_LISTEN: ":18810"
      JOTADUO_WA_STORE_DIR: "/var/lib/jotaduo-wa"
      JOTADUO_WA_HMAC_SECRET: ${JOTADUO_WA_HMAC_SECRET}
      JOTADUO_WA_ADMIN_TOKEN: ${JOTADUO_WA_ADMIN_TOKEN}
    volumes:
      - /srv/picoclaw/jotaduo-wa:/var/lib/jotaduo-wa
    networks:
      # saas_edge so Traefik can route /jotaduo-wa/pair to it under the admin
      # subdomain, AND so public tenant containers (also on saas_edge) can
      # reach jotaduo-wa:18810 internally without a published host port.
      - saas_edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=saas_edge"
      # Pairing UI is only reachable through the admin host. Path-prefix is
      # stripped so the in-binary handler sees /pair instead of /jotaduo-wa/pair.
      - "traefik.http.routers.jotaduo-wa-pair.rule=Host(`adm.${SAAS_BASE_DOMAIN}`) && PathPrefix(`/jotaduo-wa/`)"
      # Priority must beat controlplane.rule (HostRegexp + 2 Hosts ORed)
      # otherwise Traefik routes /jotaduo-wa/* to the controlplane SPA.
      - "traefik.http.routers.jotaduo-wa-pair.priority=200"
      - "traefik.http.routers.jotaduo-wa-pair.entrypoints=websecure"
      - "traefik.http.routers.jotaduo-wa-pair.tls.certresolver=letsencrypt"
      - "traefik.http.routers.jotaduo-wa-pair.middlewares=jotaduo-wa-stripprefix@docker,security-headers@file"
      - "traefik.http.middlewares.jotaduo-wa-stripprefix.stripprefix.prefixes=/jotaduo-wa"
      - "traefik.http.services.jotaduo-wa.loadbalancer.server.port=18810"

  opencrm:
    image: picoclaw/opencrm:latest
    build:
      context: ../..
      dockerfile: docker/saas/opencrm/Dockerfile
    container_name: opencrm
    restart: unless-stopped
    environment:
      OPENCRM_DB_PATH: /data/opencrm.db
      OPENCRM_PORT: "8787"
    ports:
      - "127.0.0.1:18802:8787"
    volumes:
      - /srv/saas/opencrm/data:/data
    networks:
      - saas_db
      - saas_edge
    labels:
      - "traefik.enable=false"

  controlplane:
    image: picoclaw/saas:latest
    build:
      context: ../..
      dockerfile: docker/saas/Dockerfile
    container_name: controlplane
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      dockerproxy:
        condition: service_started
      opencrm:
        condition: service_started
      # Browser sidecar is a tenant-runtime dependency (controlplane itself
      # doesn't talk to CDP), but listing it here means `docker compose up
      # -d controlplane` (without --no-deps) brings the sidecar up alongside
      # everything else. service_started instead of service_healthy so an
      # unhealthy Chromium doesn't block the controlplane from booting.
      browser-sidecar:
        condition: service_started
    ports:
      - "127.0.0.1:18801:8080"
    environment:
      PG_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_CONTROL}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      PICOCLAW_SAAS_GATEWAY_SECRET: ${PICOCLAW_SAAS_GATEWAY_SECRET:-}
      JWT_TTL_HOURS: "12"
      LISTEN_ADDR: ":8080"
      DOCKER_HOST: "tcp://dockerproxy:2375"
      LITELLM_URL: ${LITELLM_URL}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      TENANT_IMAGE: ${TENANT_IMAGE}
      TENANT_BASE_DOMAIN: ${SAAS_BASE_DOMAIN}
      TENANT_HOST_DATA_DIR: ${TENANT_HOST_DATA_DIR}
      PICOCLAW_WORKSPACE_DIR: ${PICOCLAW_WORKSPACE_DIR:-/srv/picoclaw-workspaces}
      TENANT_NETWORK_EDGE: saas_edge
      TENANT_NETWORK_LLM: saas_llm
      COOKIE_DOMAIN: ${SAAS_BASE_DOMAIN}
      COOKIE_SECURE: "true"
      OPENCRM_URL: ${OPENCRM_URL:-http://opencrm:8787}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_FROM: ${ALERT_FROM:-}
      ALERT_TO: ${ALERT_TO:-}
      ALERT_DISK_THRESHOLD_PCT: ${ALERT_DISK_THRESHOLD_PCT:-85}
      # Supabase: source of truth for tenant dashboard logins when set. Leave
      # blank to keep the legacy local sessions auth path (no behavior change
      # to existing tenants — auth_backend='local' rows ignore these vars).
      SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_SITE_URL: ${SUPABASE_SITE_URL:-https://${SAAS_BASE_DOMAIN}}
      # Shared with jotaduo-wa sidecar (same value passed to it as
      # JOTADUO_WA_HMAC_SECRET). The provisioner forwards both URL + secret
      # into public-tenant containers so Catarina's `enviar-whatsapp-jotaduo`
      # skill can sign requests. Cliente tenants don't receive these envs —
      # at promotion, the recreate strips them and the skill stops working.
      # Empty default keeps existing deployments working pre-Fatia 3.
      PICOCLAW_JOTADUO_WA_URL: ${PICOCLAW_JOTADUO_WA_URL:-http://jotaduo-wa:18810}
      PICOCLAW_JOTADUO_WA_HMAC_SECRET: ${JOTADUO_WA_HMAC_SECRET:-}
      # Shared CLI auth dirs. When set and mounted below, the provisioner
      # routes new tenants to claude-cli and/or codex-cli instead of raw
      # upstream API keys.
      PICOCLAW_TENANT_CLAUDE_CLI_AUTH_DIR: ${PICOCLAW_TENANT_CLAUDE_CLI_AUTH_DIR:-}
      PICOCLAW_TENANT_CODEX_CLI_AUTH_DIR: ${PICOCLAW_TENANT_CODEX_CLI_AUTH_DIR:-}
    volumes:
      - /srv/saas/tenants:/srv/saas/tenants
      - controlplane_data:/var/lib/picoclaw-saas
      # Workspaces directory — admin-managed tenant templates. Same path
      # inside/outside the container so PICOCLAW_WORKSPACE_DIR is portable.
      # Read-write so the admin file editor can persist edits and the
      # docker-spawned vite build can write to frontend-dist/.
      - /srv/picoclaw-workspaces:/srv/picoclaw-workspaces
      # Pass-through binds so the controlplane can os.Stat the operator CLI
      # auth dirs before adding read-only mounts to tenant containers.
      - /etc/picoclaw/claude-auth:/etc/picoclaw/claude-auth:ro
      - /etc/picoclaw/codex-auth:/etc/picoclaw/codex-auth:ro
      # NOTE: a landing de jotaduo.com (apex) é bakeada na imagem do
      # controlplane (Dockerfile stage 1b → /var/lib/picoclaw-landing/).
      # Sem bind-mount aqui = todo push em web/landing/ entra via CI/CD.
      # Hot-fix sem rebuild: re-adicionar bind-mount em override compose.
    networks:
      - saas_edge
      - saas_llm
      - saas_db
      - saas_dockerproxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=saas_edge"
      - "traefik.http.routers.controlplane.rule=Host(`${SAAS_BASE_DOMAIN}`) || Host(`admin.${SAAS_BASE_DOMAIN}`) || Host(`ia.${SAAS_BASE_DOMAIN}`) || HostRegexp(`[a-z0-9-]+\\.${SAAS_BASE_DOMAIN}`)"
      - "traefik.http.routers.controlplane.entrypoints=websecure"
      - "traefik.http.routers.controlplane.tls.certresolver=letsencrypt"
      - "traefik.http.routers.controlplane.middlewares=security-headers@file"
      - "traefik.http.services.controlplane.loadbalancer.server.port=8080"
