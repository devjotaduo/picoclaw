name: Autofix

# Runs auto-fixable lint/format tools and commits the result back to the
# PR branch. Same-repo PRs only — never runs on forks, since granting
# write to a fork's HEAD ref is a known attack vector.
#
# Limitation: pushes use the default GITHUB_TOKEN, so they do NOT trigger
# downstream workflows (GitHub design — prevents CI loops). After autofix
# commits, you'll need one more push (or a label/reopen) to re-run `pr.yml`.
# This is intentional and safer than wiring a PAT.

on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "web/frontend/**"
      - ".golangci.yaml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    # Forks send PRs from heads we don't control; never grant write to those.
    # Also skip dependabot PRs — its own rebase flow handles fix-ups.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: golangci-lint --fix (new issues only)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          # Only fix issues this PR introduced — fixing all 150 pre-existing
          # repo issues here would balloon every PR diff.
          args: --build-tags=goolm,stdjson --fix --new-from-rev=origin/main
        # The action returns non-zero when unfixable issues remain. That's
        # fine here — we still want to commit whatever WAS fixed.
        continue-on-error: true

      - name: Setup pnpm
        if: hashFiles('web/frontend/**') != ''
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        if: hashFiles('web/frontend/**') != ''
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Install web/frontend deps
        if: hashFiles('web/frontend/**') != ''
        working-directory: web/frontend
        run: pnpm install --frozen-lockfile

      - name: Prettier --write
        if: hashFiles('web/frontend/**') != ''
        working-directory: web/frontend
        run: pnpm exec prettier --write .
        continue-on-error: true

      - name: ESLint --fix
        if: hashFiles('web/frontend/**') != ''
        working-directory: web/frontend
        run: pnpm exec eslint . --fix
        continue-on-error: true

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(autofix): apply gofmt/eslint/prettier --fix"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
