name: Build & push controlplane image

# Builds the SaaS controlplane image (docker/saas/Dockerfile) and pushes
# it to GHCR. The VPS at 155.138.210.187 polls this image every 2 min via
# scripts/auto-deploy/picoclaw-deploy.sh — see docs/operations/auto-deploy.md.
#
# Tags published:
#   - :main      rolling tag for the prod VPS
#   - :sha-<7>   immutable per-commit, for rollback
#
# Uses the built-in GITHUB_TOKEN for GHCR auth — no additional secrets
# need to live in repo settings. The VPS authenticates with its own PAT,
# stored only in /root/.docker/config.json on the box itself.

on:
  push:
    branches: [main]
    paths:
      - "cmd/picoclaw-saas/**"
      - "cmd/picoclaw-tenantctl/**"
      - "internal/saas/**"
      - "pkg/**"
      - "web/saas-admin/**"
      - "go.mod"
      - "go.sum"
      - "docker/saas/Dockerfile"
      - ".github/workflows/release-controlplane.yml"
  # Manual rebuild for incident response or after fixing the Dockerfile.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/picoclaw-saas

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/saas/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA cache halves the build time on subsequent runs by reusing
          # the multi-stage Go/Node layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Only amd64 — the VPS is x86. Add arm64 later if you put
          # tenants on a Pi or ARM VPS.
          platforms: linux/amd64
