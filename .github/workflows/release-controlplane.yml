name: Build & push SaaS images

# Builds the SaaS runtime images and pushes them to GHCR. The VPS at
# 155.138.210.187 polls these images every 2 min via
# scripts/auto-deploy/picoclaw-deploy.sh — see docs/operations/auto-deploy.md.
#
# Tags published:
#   - :main        rolling tag for the prod VPS
#   - :sha-<full>  immutable per-commit, for rollback
#
# Uses the built-in GITHUB_TOKEN for GHCR auth — no additional secrets
# need to live in repo settings. The VPS authenticates with its own PAT,
# stored only in /root/.docker/config.json on the box itself.

on:
  push:
    branches: [main]
    paths:
      - "cmd/picoclaw-saas/**"
      - "cmd/picoclaw-tenantctl/**"
      - "cmd/picoclaw/**"
      - "internal/saas/**"
      - "internal/**"
      - "pkg/**"
      - "web/saas-admin/**"
      - "web/frontend/**"
      - "web/landing/**"
      - "web/backend/**"
      - "go.mod"
      - "go.sum"
      - ".dockerignore"
      - "Makefile"
      - "scripts/copydir.go"
      - "docker/saas/Dockerfile"
      - "docker/saas/docker-compose.prod.yml"
      - "docker/saas/opencrm/**"
      - "docker/Dockerfile.launcher"
      - "docker/Dockerfile.browser-sidecar"
      - ".github/workflows/release-controlplane.yml"
  # Manual rebuild for incident response or after fixing the Dockerfile.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          ns="${REGISTRY}/${IMAGE_NAMESPACE}"
          echo "controlplane=${ns}/picoclaw-saas:main,${ns}/picoclaw-saas:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "launcher=${ns}/picoclaw-launcher:main,${ns}/picoclaw-launcher:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "browser=${ns}/picoclaw-browser-sidecar:main,${ns}/picoclaw-browser-sidecar:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "opencrm=${ns}/picoclaw-opencrm:main,${ns}/picoclaw-opencrm:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push controlplane
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/saas/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.controlplane }}
          # GHA cache halves the build time on subsequent runs by reusing
          # the multi-stage Go/Node layers.
          cache-from: type=gha,scope=controlplane
          cache-to: type=gha,mode=max,scope=controlplane
          # Only amd64 — the VPS is x86. Add arm64 later if you put
          # tenants on a Pi or ARM VPS.
          platforms: linux/amd64

      - name: Build and push launcher
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.launcher
          push: true
          tags: ${{ steps.tags.outputs.launcher }}
          cache-from: type=gha,scope=launcher
          cache-to: type=gha,mode=max,scope=launcher
          platforms: linux/amd64

      - name: Build and push browser sidecar
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.browser-sidecar
          push: true
          tags: ${{ steps.tags.outputs.browser }}
          cache-from: type=gha,scope=browser-sidecar
          cache-to: type=gha,mode=max,scope=browser-sidecar
          platforms: linux/amd64

      - name: Build and push OpenCRM
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/saas/opencrm/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.opencrm }}
          cache-from: type=gha,scope=opencrm
          cache-to: type=gha,mode=max,scope=opencrm
          platforms: linux/amd64
