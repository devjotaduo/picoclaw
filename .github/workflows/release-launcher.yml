name: Build & push launcher image

# Builds the tenant launcher image (docker/Dockerfile.launcher) and pushes
# it to GHCR. Same pattern as release-controlplane.yml.
#
# UNLIKE the controlplane, this image is NOT auto-pulled by a timer on the
# VPS. Recreating a tenant container is customer-affecting (sessions,
# whatsapp store, dashboard auth) and must be intentional — done by an
# operator via `picoclaw-tenantctl recreate <tenant-id>` after manually
# pulling + retagging the image. See docs/operations/auto-deploy.md.
#
# Tags published:
#   - :main      rolling tag for operator-driven retags on the VPS
#   - :sha-<7>   immutable per-commit (for rollback)

on:
  push:
    branches: [main]
    paths:
      - "cmd/picoclaw/**"
      - "cmd/picoclaw-launcher/**"
      - "web/backend/**"
      - "web/frontend/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - ".dockerignore"
      - "Makefile"
      - "scripts/copydir.go"
      - "docker/Dockerfile.launcher"
      - ".github/workflows/release-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/picoclaw-launcher

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.launcher
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Only amd64 — matches the Vultr VPS architecture.
          platforms: linux/amd64
