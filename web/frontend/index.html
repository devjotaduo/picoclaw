<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest?v=20260516" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JotaDuo</title>
    <script>
      // Apply the persisted theme (default: dark) before first paint so no
      // surface flashes the bare light :root — including the public tenant
      // chat, which never mounts the app-header theme toggle. Mirrors
      // getStoredTheme() in src/hooks/use-theme.ts.
      (function () {
        try {
          if ((localStorage.getItem("theme") || "dark") === "dark") {
            document.documentElement.classList.add("dark")
          }
        } catch (e) {
          document.documentElement.classList.add("dark")
        }
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
